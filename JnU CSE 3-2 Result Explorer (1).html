/* ---------- Students ---------- */
let q={s:'',cm:'',lg:'',f:0,k:'n',d:1};
const COLS=[['n','#',s=>s.n],['id','Roll / ID',s=>s.id],['name','Name',s=>s.name],['gpa','GPA',s=>s.gpa],['cgpa','CGPA',s=>s.cgpa],['bl','Backlog cr.',s=>s.bl],['rg','GPA rank',s=>s.rg],['cm','Result',s=>s.cm]];
function st(){
 $('#m').innerHTML=`<div class="ctl"><input id="qs" placeholder="Search name or roll (e.g. 005 or B210305005)" value="${E(q.s)}">
 <select id="qc"><option value="">All results</option><option value="P">Passed (P)</option><option value="CP">Conditionally passed (CP)</option><option value="NP">Not passed (NP)</option></select>
 <select id="ql"><option value="">Any semester grade</option>${GL.map(l=>`<option>${l}</option>`).join('')}</select>
 <label class="tg"><input type="checkbox" id="qf" style="min-width:0"> Has an F</label><span class="muted" id="qn"></span></div><div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>`;
 $('#qc').value=q.cm;$('#ql').value=q.lg;$('#qf').checked=!!q.f;
 $('#qs').oninput=e=>{q.s=e.target.value;rows()};$('#qc').onchange=e=>{q.cm=e.target.value;rows()};$('#ql').onchange=e=>{q.lg=e.target.value;rows()};$('#qf').onchange=e=>{q.f=e.target.checked;rows()};
 $('#hd').onclick=e=>{const k=e.target.dataset.k;if(!k)return;q.d=q.k==k?-q.d:(k=='gpa'||k=='cgpa'?-1:1);q.k=k;rows()};rows();
}
function rows(){
 const t=q.s.trim().toLowerCase(),c=COLS.find(c=>c[0]==q.k)[2];
 let r=S.filter(s=>(!t||s.id.toLowerCase().includes(t)||s.name.toLowerCase().includes(t))&&(!q.cm||s.cm==q.cm)&&(!q.lg||LG(s.gpa)==q.lg)&&(!q.f||s.f));
 r.sort((a,b)=>{const x=c(a),y=c(b);return(x>y?1:x<y?-1:0)*q.d});
 $('#hd').innerHTML=COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${q.k==c[0]?(q.d>0?' ↑':' ↓'):''}</th>`).join('');
 $('#qn').textContent=r.length+' of '+S.length+' students';
 $('#tb').innerHTML=r.map(s=>`<tr class="cl" data-o="${s.id}"><td>${s.n}</td><td>${s.id}</td><td>${E(s.name)}</td><td>${chip(s.gpa)}</td><td>${f2(s.cgpa)}</td><td>${s.bl||'–'}</td><td>${s.rg}</td><td><span class="tag ${s.cm}" title="${RES[s.cm]}">${s.cm}</span>${s.f?` <span class="tag F">${s.f} F</span>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="hint">No students match these filters.</td></tr>';
}
/* ---------- Compare ---------- */
const cmp={a:null,b:null};
function find(v){v=v.trim().toLowerCase();if(!v)return[];let r=S.filter(s=>s.id.toLowerCase()==v);if(r.length)return r;r=S.filter(s=>s.id.toLowerCase().endsWith(v));return r.length?r:S.filter(s=>s.id.toLowerCase().includes(v)||s.name.toLowerCase().includes(v))}
function cp(){
 const opts=S.map(s=>`<option value="${s.id}">${E(s.name)}</option>`).join('');
 $('#m').innerHTML=`<datalist id="dl">${opts}</datalist><div class="ctl"><input list="dl" id="ia" placeholder="Student A: roll or name" style="border-color:var(--A)" value="${cmp.a||''}"><input list="dl" id="ib" placeholder="Compare with: roll or name (blank = class average)" style="border-color:var(--B)" value="${cmp.b||''}"></div><div class="muted" id="msg" style="margin-bottom:8px"></div><div id="cv"></div>`;
 const bind=(id,k)=>$(id).oninput=e=>{const r=find(e.target.value);cmp[k]=r.length==1?r[0].id:null;$('#msg').textContent=e.target.value&&r.length!=1?(r.length?r.length+' matches – keep typing or pick from the list':'No student found'):'';view()};
 bind('#ia','a');bind('#ib','b');view();
}
function view(){
 const A=cmp.a&&byId(cmp.a);if(!A){$('#cv').innerHTML='<div class="card hint">Search a roll number or name to see a full profile, then compare with another student or the class average.</div>';return}
 const B=cmp.b&&cmp.b!=cmp.a?byId(cmp.b):AVG;let wa=0,wb=0,ti=0,lead=[];
 const body=C.map((c,i)=>{const a=A.gp[i],b=B.gp[i],d=a-b;d>0.001?wa++:d<-0.001?wb++:ti++;lead.push([d,c]);
  const ca=d>0.001?'win':d<-0.001?'lose':'',cb=d<-0.001?'win':d>0.001?'lose':'';
  return`<tr><td>${c.code}<div class="muted" style="font-size:11px">${c.t}</div></td><td>${c.cr}</td><td class="${ca}">${chip(a)}</td><td class="${cb}">${B.avg?f2(b):chip(b)}</td><td>${(d>0?'+':'')+f2(d)}</td><td class="muted">${f2(cs[i].m)}</td><td class="bp"><i style="width:${a/4*100}%;background:var(--A)"></i><i style="width:${b/4*100}%;background:var(--B)"></i></td></tr>`}).join('');
 const card=(s,c)=>`<div class="card pf" style="--c:var(--${c})"><h2>${E(s.name)}</h2><div class="s">${s.id}${s.avg?'':' · '+RES[s.cm]}</div><div class="grid" style="margin-top:10px;grid-template-columns:repeat(3,1fr)"><div class="k"><b>${f2(s.gpa)}</b><span>GPA · rank ${s.rg}</span></div><div class="k"><b>${f2(s.cgpa)}</b><span>CGPA · rank ${s.rc}</span></div><div class="k"><b>${s.avg?f2(s.bl):s.bl}</b><span>backlog cr.</span></div></div></div>`;
 const w=(x,y,l)=>Math.abs(x-y)<.005?`Level on ${l}.`:`${x>y?E(A.name):E(B.name)} is ahead on ${l} by ${f2(Math.abs(x-y))}.`;
 lead.sort((x,y)=>y[0]-x[0]);const tg=C.reduce((a,c,i)=>a+c.cr*(A.gp[i]-B.gp[i]),0),beat=s=>C.filter((c,i)=>s.gp[i]>cs[i].m).length;
 const na=E(A.name),nb=E(B.name),ths=[grpAvg(A,'Theory'),grpAvg(B,'Theory')],lbs=[grpAvg(A,'Lab'),grpAvg(B,'Lab')];
 const ins=[`${na} wins ${wa} courses, ${nb} wins ${wb}, ${ti} tied.`,
 lead[0][0]>0?`${na}'s biggest edge: ${lead[0][1].code} (+${f2(lead[0][0])}).`:'',
 lead[9][0]<0?`${nb}'s biggest edge: ${lead[9][1].code} (+${f2(-lead[9][0])}).`:'',
 w(A.gpa,B.gpa,'semester GPA')+' '+w(A.cgpa,B.cgpa,'CGPA'),
 `Credit-weighted, the grade-point total differs by ${f2(Math.abs(tg))} (${tg>=0?'A':'B'} ahead).`,
 `Theory average: ${f2(ths[0])} vs ${f2(ths[1])}. Labs, project and viva: ${f2(lbs[0])} vs ${f2(lbs[1])}.`,
 `${na} beats the class average in ${beat(A)} of ${C.length} courses${B.avg?'':`; ${nb} in ${beat(B)}`}.`,
 A.gpa-A.cgpa>.2?`${na}'s semester GPA is ${f2(A.gpa-A.cgpa)} above their CGPA: an upward trend.`:A.cgpa-A.gpa>.2?`${na}'s semester GPA is ${f2(A.cgpa-A.gpa)} below their CGPA: a dip this semester.`:'',
 A.f?`${na} has an F in ${C.filter((c,i)=>!A.gp[i]).map(c=>c.code).join(', ')}.`:'',B.f?`${nb} has an F in ${C.filter((c,i)=>!B.gp[i]).map(c=>c.code).join(', ')}.`:''].filter(Boolean);
 $('#cv').innerHTML=`<div class="grid two">${card(A,'A')}${card(B,'B')}</div>
 <div class="tw" style="margin-top:12px"><table><thead><tr><th>Course</th><th>Cr</th><th style="color:var(--A)">${na}</th><th style="color:var(--B)">${nb}</th><th>Diff</th><th>Class avg</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
 <div class="card" style="margin-top:12px"><h3>Insights</h3><ul class="in">${ins.map(i=>`<li>${i}</li>`).join('')}</ul><div class="muted" style="font-size:12px;margin-top:8px">Green ▲ marks the better grade in each course.</div></div>`;
}
/* ---------- Courses ---------- */
let sel=null;
function co(){
 const sk=c=>`<div class="sk">${c.dist.map((n,j)=>n?`<i title="${GL[j]}: ${n}" style="width:${n/S.length*100}%;background:${col(GV[j])}"></i>`:'').join('')}</div>`;
 const order=[...S].sort((a,b)=>b.gpa-a.gpa);
 $('#m').innerHTML=`<div class="tw"><table><thead><tr><th>Course</th><th>Type</th><th>Cr</th><th>Avg GP</th><th>Std dev</th><th>A or better</th><th>F</th><th>Grade mix</th></tr></thead><tbody>${cs.map(c=>`<tr class="cl" data-c="${c.i}"><td>${c.code}<div class="muted" style="font-size:11px">${c.t}</div></td><td>${c.ty}</td><td>${c.cr}</td><td>${chip(c.m)}</td><td>${f2(c.sd)}</td><td>${c.ap} (${(c.ap/S.length*100).toFixed(0)}%)</td><td>${c.f?`<span class="tag F">${c.f}</span>`:'–'}</td><td>${sk(c)}</td></tr>`).join('')}</tbody></table></div>
 <div class="card" id="cd" style="margin:12px 0"><span class="muted">Select a course row to see its toppers and F grades.</span></div>
 <h3 style="margin:18px 0 8px">Grade heatmap (sorted by semester GPA)</h3><div class="tw hm"><table><thead><tr><th>Student</th>${C.map(c=>`<th title="${c.t}">${c.code.replace(/^CSE?/,'')}</th>`).join('')}<th>GPA</th></tr></thead><tbody>${order.map(s=>`<tr class="cl" data-o="${s.id}"><td>${E(s.name)}</td>${s.gp.map(g=>`<td style="background:${col(g)}">${g}</td>`).join('')}<td><b>${f2(s.gpa)}</b></td></tr>`).join('')}</tbody></table></div>`;
 $('#m').querySelector('tbody').onclick=e=>{const r=e.target.closest('[data-c]');if(!r)return;const c=cs[+r.dataset.c],mx=Math.max(...S.map(s=>s.gp[c.i])),fs=S.filter(s=>!s.gp[c.i]);
  $('#cd').innerHTML=`<h3>${c.code} · ${c.t}</h3><div class="grid two"><div><b>Highest (${mx.toFixed(2)}):</b> ${S.filter(s=>s.gp[c.i]==mx).map(s=>`<a href="#" data-o="${s.id}" style="color:var(--ac)">${E(s.name)}</a>`).join(', ')}</div><div><b>F grades:</b> ${fs.length?fs.map(s=>`<a href="#" data-o="${s.id}" style="color:var(--ac)">${E(s.name)}</a>`).join(', '):'none'}</div></div><div class="muted" style="margin-top:6px">Pass rate ${((1-c.f/S.length)*100).toFixed(0)}% · average ${f2(c.m)} (${LG(c.m)}) · spread ${f2(c.sd)}</div>`};
}
go('ov');
</script></body></html>
